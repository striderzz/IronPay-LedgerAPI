name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ironpay
          POSTGRES_PASSWORD: ironpay
          POSTGRES_DB: ironpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironpay -d ironpay"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ironpay:ironpay@localhost:5432/ironpay
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/striderzz/ironpay-ledgerapi
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  compose:
    # Proves the one-command demo: build and start the full stack, seed it, move money,
    # and check that the relay published the events and the ledger balances.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up
        run: docker compose up -d --build --wait
      - name: Seed and smoke test
        run: |
          docker compose exec -T api python -m scripts.seed
          TOKEN=$(curl -sf -X POST localhost:8000/auth/token -H "Content-Type: application/json"             -d '{"email": "asha@example.com", "password": "demo-password-123"}' | jq -r .access_token)
          FROM=$(curl -sf localhost:8000/accounts -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id')
          curl -sf -X POST localhost:8000/transfers -H "Authorization: Bearer $TOKEN"             -H "Idempotency-Key: ci-smoke-1" -H "Content-Type: application/json"             -d "{\"from_account_id\": \"$FROM\", \"to_handle\": \"riya@ironpay\", \"amount_minor\": 25000}"
          sleep 3
          docker compose exec -T redis redis-cli XLEN ironpay.events | tee /dev/stderr | grep -qx 3
          docker compose exec -T api python -m scripts.check_ledger
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
