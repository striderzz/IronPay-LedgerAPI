name: Load test

# Manual: Actions tab -> Load test -> Run workflow. Results are uploaded as an artifact
# and copied into docs/results/ by hand, with the runner's hardware listed.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Arrival rates (transfers/sec) for the step test"
        default: "100 120 140 160 180 200 250"

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+psycopg://ironpay:ironpay@localhost:5432/ironpay
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: load-test-secret-not-for-production
      LOG_LEVEL: WARNING
      # Measure the API, not the limiter: per-user limits far above the test rates.
      TRANSFER_RATE_PER_SEC: "100000"
      TRANSFER_BURST: "100000"
      LOGIN_RATE_PER_SEC: "100000"
      LOGIN_BURST: "100000"
      ACCESS_TOKEN_MINUTES: "120"
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "20"
      RESULTS: results
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=ironpay -e POSTGRES_PASSWORD=ironpay -e POSTGRES_DB=ironpay \
            postgres:16.6-alpine -c max_connections=300
          docker run -d --name redis -p 6379:6379 redis:7.4-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ironpay && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: Start API (4 uvicorn workers) and relay
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 > api.log 2>&1 &
          nohup python -m worker.outbox_relay > relay.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - name: Record machine
        run: |
          mkdir -p $RESULTS
          python - <<'EOF'
          import json, os, platform, subprocess
          mem = subprocess.run(["free", "-h"], capture_output=True, text=True).stdout.split("\n")[1].split()[1]
          json.dump({"runner": "GitHub Actions ubuntu-latest", "cpus": os.cpu_count(), "mem": mem,
                     "kernel": platform.release(), "api": "uvicorn, 4 workers",
                     "note": "API, PostgreSQL, Redis and k6 share this one machine"},
                    open(os.environ["RESULTS"] + "/machine.json", "w"), indent=2)
          EOF
          k6 version >> $RESULTS/versions.txt
      - name: Constant arrival rate (latency)
        run: |
          RATE=100 DURATION=60s USERS=200 OUT=$RESULTS/k6_constant.json k6 run --quiet loadtest/transfers.js
          python -m scripts.check_ledger > $RESULTS/ledger_after_constant.json
      - name: Retry storm (duplicates)
        run: |
          before=$(python -m scripts.count_transfers)
          RATE=20 DURATION=60s USERS=100 OUT=$RESULTS/k6_storm.json k6 run --quiet loadtest/retry_storm.js
          after=$(python -m scripts.count_transfers)
          python - "$before" "$after" <<'EOF'
          import json, os, sys
          before, after = int(sys.argv[1]), int(sys.argv[2])
          s = json.load(open(os.environ["RESULTS"] + "/k6_storm.json"))
          keys = int(s["metrics"]["unique_keys"]["values"]["count"])
          sends = int(s["metrics"]["http_reqs{name:transfer}"]["values"]["count"])
          created = after - before
          json.dump({"unique_keys": keys, "requests_sent": sends, "transfers_created": created,
                     "duplicate_transfers": created - keys},
                    open(os.environ["RESULTS"] + "/storm.json", "w"), indent=2)
          EOF
      - name: Step test (max throughput)
        # Stops at the first rate that misses the criteria; overload past that point only
        # builds a backlog that slows the next run. 20 s cool-down between steps.
        run: |
          for r in ${{ inputs.steps }}; do
            RATE=$r DURATION=30s USERS=200 OUT=$RESULTS/k6_step_$r.json k6 run --quiet loadtest/transfers.js || true
            if ! python -m scripts.summarize_load --check $RESULTS/k6_step_$r.json; then
              echo "rate $r missed the criteria; stopping"; break
            fi
            sleep 20
          done
      - name: Final ledger check
        run: python -m scripts.check_ledger | tee $RESULTS/ledger_final.json
      - name: Summarize
        if: always()
        run: |
          python -m scripts.summarize_load $RESULTS || true
          cp api.log relay.log $RESULTS/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results
          path: results/
